Chapter 36",kicker:"Blame through time",title:"Training: the blame travels back through every week",steps:4,notes:{time:"2 min",say:"Backprop through an unrolled RNN goes right to left across the weeks. At each week it is multiplied by the cell’s slope (u times the tanh slope). Usually less than 1, so after 20 weeks almost nothing reaches week 1, and the weights that should notice week 1 never learn. It is called backpropagation through time; the problem is the vanishing gradient again.",ask:"Which deck 5 fix would you try?"},render:({step:e})=>o.jsx(qi,{step:e,items:[{label:"Unrolled",text:"the RNN is a deep network: one layer per week",tone:"orange"},{label:"Each week back",text:"blame × (u × tanh’s slope), usually below 1",tone:"red"},{label:"20 weeks back",text:"almost nothing left: week 1 cannot be learned",tone:"red"},{label:"The fix",text:"a memory path where nothing shrinks: gates",tone:"green"}]})},{id:"e7-ch36-takeaway",section:"Chapter 36",kicker:"Takeaway",title:"A plain RNN multiplies its memory down every step, so it forgets.",layout:"statement",steps:1,notes:{time:"1 min",say:"The one sentence for Chapter 36.",ask:"What would a memory that does not shrink look like?"},render:({step:e})=>o.jsx(or,{step:e,kicker:"Chapter 36 · The one sentence",title:"A plain RNN multiplies its memory down every step, so it forgets.",sub:"Next: a memory belt with valves. LSTM and GRU."})}]},Hp={id:"lstm",code:"37",label:"LSTM and GRU",title:"LSTM and GRU: memory with valves",slides:[{id:"e7-ch37",section:"Chapter 37",kicker:"Chapter 37",title:"LSTM and GRU: memory with valves",layout:"chapter",steps:1,notes:{time:"1 min",say:"The LSTM (long short-term memory, 1997) adds a separate memory belt that is only changed through gates: learned valves between 0 (closed) and 1 (open).",ask:"What decisions would a good memory make each week?"},render:({step:e})=>o.jsx(zl,{step:e,label:"Deck 7 · Chapter 37",title:"LSTM and GRU: memory with valves",question:"How can a memory keep week 1 for 20 weeks, and still forget what doesn’t matter?",agenda:"The memory belt, three gates, a live gate, the proof, GRU, and a forecast."})},{id:"e7-gates-predict",section:"Chapter 37",kicker:"You predict",title:"Your memory of Asha: what three decisions do you make each week?",steps:3,reveal:!0,notes:{time:"2 min",say:"Think like a teacher keeping notes. Do I still need last month’s note? Is this week worth writing down? What do I need right now to make a prediction? Those are the LSTM’s three gates.",ask:"Which decision stops week 1 being forgotten?"},render:({step:e,revealed:t})=>o.jsx(ar,{step:e,revealed:t,question:"A teacher keeping notes on Asha. Each week they decide…",facts:["Something about the old notes","Something about this week","Something about today’s prediction"],verdict:"Forget? Write? Show?",points:["Forget gate: how much old memory to keep","Input gate: how much of this week to write","Output gate: how much to use for the answer"]})},{id:"e7-lstm-cell",section:"Chapter 37",kicker:"The cell",title:"An LSTM: a memory belt with three valves",steps:4,notes:{time:"3 min",say:"Step 1: the memory belt runs straight through every week; it is only multiplied by the forget gate and added to by the input gate, nothing else. Step 2: forget gate, a number from 0 to 1: 1 keeps everything, 0 wipes it. Step 3: input gate: how much of this week to add. Step 4: output gate: how much of the memory to show to the answer. Each gate is a small sigmoid neuron (Chapter 15) reading this week’s score and last week’s output: the gates are learned.",ask:"If the forget gate stays at 1 and the input gate at 0, what happens to the memory?"},render:({step:e})=>o.jsx(Zi,{step:e,caption:"Each gate is a sigmoid neuron (0 = closed, 1 = open), learned like any weight.",children:o.jsx("div",{style:{width:1300},children:o.jsx($p,{step:e})})})},{id:"e7-gate-lab",section:"Chapter 37",kicker:"Live calculator",title:"Slide the forget gate: does week 1 survive to week 20?",lab:!0,notes:{time:"3 min",say:"Start at 0.5, like a plain RNN that keeps half: week 1 is gone by week 6. Slide to 0.9: 13% at week 20. To 1.0: 100%. An LSTM learns to hold its forget gate near 1 for things worth remembering, and near 0 to clear things that are no longer useful.",ask:"What forget value keeps at least half of week 1 after 20 weeks? (About 0.965.)"},render:()=>o.jsx(Ip,{})},{id:"e7-blame-proof",section:"Chapter 37",kicker:"Proof",title:"Measured: an open forget gate keeps the blame alive",steps:5,notes:{time:"2 min",say:"Measured in PyTorch, not by hand: the share of the blame from the final week that reaches week 1, middle value over 20 random starts. A plain RNN: one in 200,000 after 20 weeks. An LSTM with its forget gate open: three quarters. That is why LSTMs can learn long-range patterns. The notebook reproduces this.",ask:"Why does even the LSTM drop by 50 weeks?"},render:({step:e})=>o.jsx(ga,{step:e,claim:"Share of the blame reaching week 1 (PyTorch, median of 20 random starts)",head:["Weeks back","Plain RNN","LSTM, forget gate open"],highlight:2,rows:us.map(t=>[String(t.weeks),dt(t.rnn),dt(t.lstm)]),verdict:"Gates give the blame, and the memory, a path that does not shrink."})},{id:"e7-gru",section:"Chapter 37",kicker:"GRU",title:"GRU: the same idea with two gates",steps:3,notes:{time:"2 min",say:"The GRU (gated recurrent unit, 2014) merges the belt and the output, and uses two gates: update (how much to replace the memory with new information) and reset (how much of the past to use when reading this week). Fewer weights, often just as good. Try both.",ask:"When might fewer weights matter?"},render:({step:e})=>o.jsx(Cp,{step:e,foot:"LSTM or GRU: try both; they often perform similarly.",items:[{tag:"LSTM · 3 gates",title:"Forget, input, output",body:"A separate memory belt; the classic choice",tone:"orange"},{tag:"GRU · 2 gates",title:"Update, reset",body:"Simpler, fewer weights, often as good",tone:"green"}]})},{id:"e7-forecast-proof",section:"Chapter 37",kicker:"Proof",title:"An LSTM forecasts week 9 better than simple rules",steps:4,notes:{time:"2 min",say:`800 students’ weekly tests to train, 200 new students to check, predicting week 9 from weeks 1–8. Average miss in marks. Repeating last week: ${lt.last}. Averaging all eight weeks: ${lt.mean} (it ignores the trend). A Keras LSTM: ${lt.lstm}. For Asha it predicts ${Ve}.`,ask:"Why is the average of all weeks so bad here?"},render:({step:e})=>o.jsx(ga,{step:e,claim:"Predict week 9 from weeks 1–8 · 200 new students · average miss in marks",head:["Method","Average miss"],highlight:2,rows:[["Repeat last week",String(lt.last)],["Average of all 8 weeks",String(lt.mean)],["Keras LSTM (16 units)",String(lt.lstm)]],verdict:`The LSTM reads the trend in order. For Asha: ${Ve}.`})},{id:"e7-nb-seq",section:"Chapter 37",kicker:"Notebook demo",title:"Live demo: memory, forgetting and an LSTM forecast",steps:4,notes:{time:"6 min",say:"Switch to Jupyter. The memory note by hand; the blame-through-time measurement for RNN vs LSTM; then a Keras LSTM forecasting week 9 for 200 new students and for Asha.",ask:"Before running: how much blame reaches week 1 in a plain RNN after 20 weeks?"},render:({step:e})=>o.jsx(Lp,{step:e,notebook:"ch34-sequences.ipynb",goal:"Memory by hand, vanishing through time, and an LSTM forecast in Keras.",cells:["The memory note: 60, 65, 57.5, 68.75","Blame to week 1: RNN vs LSTM","Weekly tests for 1,000 students","Keras LSTM: train and forecast","Proof: beats the simple rules"],watch:["RNN: blame vanishes","LSTM: forget gate keeps it",`Asha’s week 9: ${Ve}`],yourTurn:"Swap LSTM for GRU. Better, worse, or the same?"})},{id:"e7-ch37-takeaway",section:"Chapter 37",kicker:"Takeaway",title:"LSTM and GRU add gates that decide what to keep, so memory lasts.",layout:"statement",steps:1,notes:{time:"1 min",say:"The one sentence for Chapter 37.",ask:"Which gate keeps week 1 alive?"},render:({step:e})=>o.jsx(or,{step:e,kicker:"Chapter 37 · The one sentence",title:"LSTM and GRU add gates that decide what to keep, so memory lasts.",sub:"But they still read one step at a time. Next: attention reads everything at once."})},{id:"e7-anchor-end",section:"Chapter 37",kicker:"Anchor message",title:"The anchor message, now shown",steps:2,notes:{time:"1 min",say:"The evidence: a memory note carries the weeks; halving every week erases week 1 by week 20; a plain RNN’s blame fades to one in 200,000; an open forget gate keeps three quarters; and the LSTM beats simple rules on real forecasting.",ask:"Explain the forget gate in one sentence."},render:({step:e})=>o.jsxs(Ac,{step:e,support:`Plain RNN: blame to week 1 after 20 weeks ≈ ${dt(us[2].rnn)}. LSTM with open forget gate: ${dt(us[2].lstm)}. Forecast miss: ${lt.lstm} vs ${lt.last}.`,children:["A sequence model carries ",o.jsx("em",{children:"a memory"})," from week to week; ",o.jsx("em",{children:"gates"})," decide what to keep, so it can remember far back."]})},{id:"e7-recap",section:"Chapter 37",kicker:"Recap",title:"What you can now do",steps:5,notes:{time:"2 min",say:"Five ideas from deck 7.",ask:"Draw an unrolled RNN for your neighbour."},render:({step:e})=>o.jsx(qi,{step:e,items:[{text:"Explain why order matters, and carry a memory forward by hand",tone:"blue"},{text:"Draw an RNN: one cell, reused every step",tone:"orange"},{text:"Explain forgetting: memory and blame multiplied down each step",tone:"red"},{text:"Describe an LSTM’s belt and three gates; a GRU’s two",tone:"green"},{text:"Forecast a sequence with a Keras LSTM and beat simple rules",tone:"plain"}]})},{id:"e7-next",section:"Chapter 37",kicker:"Next",title:"Next: attention, every word looking at every other",layout:"statement",steps:1,notes:{time:"1 min",say:"Next deck: teacher comments. “The student who missed classes in March improved in May.” To understand “improved” you must look back at “student”, many words earlier. Attention lets every word look directly at every other word, no long chain to forget along. It is the heart of the Transformer and every chat assistant.",ask:"In that sentence, which word does “improved” need?"},render:({step:e})=>o.jsx(or,{step:e,kicker:"Next deck · Chapter 38",title:"Attention: every word looking at every other",sub:"Teacher comments, query-key-value by hand, and the Transformer."})}]},Vp={id:"ai-deck-7",out:"slides/deck-7-sequences.html",parts:[Wp,Up,Bp,Hp],skin:"stage",rules:{noCode:!0,oneFocal:!0,humanFirst:!0,incremental:!0},meta:{brand:"AI",label:"AI from zero · Deck 7 · Sequences: RNN, LSTM, GRU",mapKicker:"AI TRAINING · DECK 7 · CHAPTERS 34–37",mapTitle:"Sequences: RNN, LSTM, GRU",mapBlurb:"Order, memory, forgetting, gates, and forecasting Asha’s weekly tests",storageKey:"ai-edu-deck-7",lessonLabel:e=>`Chapter ${Number(e.code)}`}},Kp=Object.freeze(Object.defineProperty({__proto__:null,deck:Vp},Symbol.toStringTag,{value:"Module"}));</script>
